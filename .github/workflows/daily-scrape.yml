name: daily-scrape

# Every day:  scrape + merge (each league)  ->  xG model (all leagues pooled)  ->  wide tables (each league)
#                                           ->  info tables (each league, alongside the xG model)
#   wide + info  ->  analytics: PMR, DRF, sequences, grades, VAEP, process-data (each league)
#   analytics    ->  publish: every league's analytics merged into All_leagues/ on Cloudflare R2

on:
  schedule:
    - cron: "17 5 * * *"   # every day 05:17 UTC (GitHub sometimes starts scheduled runs a bit late)
  workflow_dispatch:         # the "Run workflow" button
    inputs:
      only:
        description: "Only these leagues, comma-separated (e.g. USA/MLS,USA/USL or Brazil). Empty = all"
        required: false
        default: ""
      stages:
        description: "What to run"
        type: choice
        default: all
        options:
          - all                # scrape -> xG model -> wide tables
          - scrape             # scrape + merge only
          - xg-and-wide        # skip scraping: xG model, then wide tables
          - wide               # wide tables only (uses the xG already in Drive)
          - info               # info tables only (Pos_info.csv etc.)
          - analytics          # PMR, DRF, sequences, grades, VAEP, process-data only
          - info-and-analytics # info tables, then analytics
          - publish            # All_leagues/ to Cloudflare R2 only (uses what is in Drive)

permissions:
  contents: write            # for the daily keep-alive commit

# One full run at a time. A manual run limited to some leagues ("only" filled in)
# gets its own lane, so it can start while the daily run is still going - just
# don't pick a league the other run is still scraping.
concurrency:
  group: daily-scrape${{ github.event_name == 'workflow_dispatch' && inputs.only != '' && format('-{0}', inputs.only) || '' }}
  cancel-in-progress: false

env:
  DRIVE_REMOTE: gdrive
  DRIVE_ROOT: scrape
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.14"     # the version your Mac uses

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}               # every league: xG, wide, info, analytics, publish
      scrape_matrix: ${{ steps.plan.outputs.scrape_matrix }} # minus Skip_scrape=Yes leagues
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Google Drive login
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then echo "::error::Add the RCLONE_CONF secret (see README)"; exit 1; fi
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Read the league list from Drive
        id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: python pipeline.py plan --only "$ONLY" >> "$GITHUB_OUTPUT"

  scrape:
    needs: plan
    if: >-
      needs.plan.outputs.scrape_matrix != '[]' &&
      (github.event_name == 'schedule' || inputs.stages == 'all' || inputs.stages == 'scrape')
    name: scrape ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 350     # GitHub's hard limit is 360; pipeline.py stops scraping well before
    strategy:
      fail-fast: false       # one league failing never stops the others
      max-parallel: 6        # leagues at the same time - gentle on Scoresway/Fotmob and Drive
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.scrape_matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Google Drive login
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Extra swap for big leagues
        run: |
          # merging a whole season (e.g. the Championship) can need more than the
          # machine's 16 GB; this adds 16 GB of overflow so it slows down instead
          # of being stopped (exit code 143)
          (sudo fallocate -l 16G /mnt/swapfile2 && sudo chmod 600 /mnt/swapfile2 \
            && sudo mkswap /mnt/swapfile2 >/dev/null && sudo swapon /mnt/swapfile2) \
            || echo "::warning::could not add extra swap - continuing without it"
          free -h
      - name: Scrape, merge, save to Drive
        env:
          LEAGUE_JSON: ${{ toJSON(matrix) }}
        run: python pipeline.py run

  # One job: every league's merged/final_events.parquet pooled into run_xg.py.
  # Runs even if some leagues failed to scrape (it uses whatever is in Drive).
  xg:
    needs: [plan, scrape]
    if: >-
      needs.plan.result == 'success' && !cancelled() &&
      (github.event_name == 'schedule' || inputs.stages == 'all' || inputs.stages == 'xg-and-wide')
    name: xG model (all leagues)
    runs-on: ubuntu-latest
    timeout-minutes: 350     # the pooled model; GitHub stops any job at 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Google Drive login
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Extra swap for big leagues
        run: |
          # GitHub machines have 16 GB of memory; this adds 16 GB of overflow on the spare disk
          # so a very big league slows down instead of being stopped (exit code 143).
          (sudo fallocate -l 16G /mnt/swapfile2 && sudo chmod 600 /mnt/swapfile2 \
            && sudo mkswap /mnt/swapfile2 >/dev/null && sudo swapon /mnt/swapfile2) \
            || echo "::warning::could not add extra swap - continuing without it"
          free -h
      - name: Train xG model, save each league's xG.parquet
        env:
          XG_EXTRA_ARGS: ${{ vars.XG_EXTRA_ARGS }}   # e.g. --model lgbm (repository variable)
        run: python pipeline.py xg

  # One job per league: build_wide_events_loc.py with the shots / no-shots flags.
  # Runs even if the model failed: no-shots leagues then use their previous xG.parquet.
  wide:
    needs: [plan, xg]
    if: >-
      needs.plan.result == 'success' && !cancelled() && needs.plan.outputs.matrix != '[]' &&
      (github.event_name == 'schedule' || inputs.stages == 'all' ||
       inputs.stages == 'xg-and-wide' || inputs.stages == 'wide')
    name: wide ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Google Drive login
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Extra swap for big leagues
        run: |
          # GitHub machines have 16 GB of memory; this adds 16 GB of overflow on the spare disk
          # so a very big league slows down instead of being stopped (exit code 143).
          (sudo fallocate -l 16G /mnt/swapfile2 && sudo chmod 600 /mnt/swapfile2 \
            && sudo mkswap /mnt/swapfile2 >/dev/null && sudo swapon /mnt/swapfile2) \
            || echo "::warning::could not add extra swap - continuing without it"
          free -h
      - name: Build wide_events
        env:
          LEAGUE_JSON: ${{ toJSON(matrix) }}
        run: python pipeline.py wide

  # One job per league: info_tables.py -> <league>/info_tables/*.csv. Needs only the merger
  # output, so it runs at the same time as the xG model.
  info:
    needs: [plan, scrape]
    if: >-
      needs.plan.result == 'success' && !cancelled() && needs.plan.outputs.matrix != '[]' &&
      (github.event_name == 'schedule' || inputs.stages == 'all' || inputs.stages == 'info' ||
       inputs.stages == 'info-and-analytics')
    name: info ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Google Drive login
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Build info tables
        env:
          LEAGUE_JSON: ${{ toJSON(matrix) }}
        run: python pipeline.py info

  # One job per league, after its wide table and info tables exist: your PMR, DRF,
  # sequences (+ dashboard tables), grades, VAEP and process-data scripts.
  analytics:
    needs: [plan, wide, info]
    if: >-
      needs.plan.result == 'success' && !cancelled() && needs.plan.outputs.matrix != '[]' &&
      (github.event_name == 'schedule' || inputs.stages == 'all' ||
       inputs.stages == 'analytics' || inputs.stages == 'info-and-analytics')
    name: analytics ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-analytics.txt
      - run: pip install -r requirements.txt -r requirements-analytics.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Node packages
        run: npm install --no-save --no-audit --no-fund @duckdb/node-api hyparquet
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Google Drive login
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Extra swap for big leagues
        run: |
          (sudo fallocate -l 16G /mnt/swapfile2 && sudo chmod 600 /mnt/swapfile2 \
            && sudo mkswap /mnt/swapfile2 >/dev/null && sudo swapon /mnt/swapfile2) \
            || echo "::warning::could not add extra swap - continuing without it"
          free -h
      - name: PMR, DRF, sequences, grades, VAEP, process-data
        env:
          LEAGUE_JSON: ${{ toJSON(matrix) }}
          ANALYTICS_STEPS: ${{ vars.ANALYTICS_STEPS }}   # optional repo variable, e.g. pmr,drf
        run: python pipeline.py analytics

  # Every league's analytics/ stacked into one file per table (Region column added),
  # big tables as parquet, uploaded to Cloudflare R2 for the app. Needs the repository
  # variable R2_REMOTE (e.g. r2:football-app) and an [r2] section in RCLONE_CONF.
  publish:
    needs: [plan, analytics]
    if: >-
      needs.plan.result == 'success' && !cancelled() &&
      (github.event_name == 'schedule' || inputs.stages == 'all' || inputs.stages == 'analytics' ||
       inputs.stages == 'info-and-analytics' || inputs.stages == 'publish')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-analytics.txt
      - run: pip install -r requirements.txt -r requirements-analytics.txt
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Google Drive + R2 login
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Room on the big disk
        run: sudo mkdir -p /mnt/publish && sudo chown "$USER" /mnt/publish && df -h / /mnt
      - name: Merge all leagues and upload to R2
        env:
          R2_REMOTE: ${{ vars.R2_REMOTE }}                    # e.g. r2:football-app
          R2_FOLDER: ${{ vars.R2_FOLDER }}                    # default All_leagues
          PUBLISH_PARQUET_MB: ${{ vars.PUBLISH_PARQUET_MB }}  # default 25
          PUBLISH_SKIP: ${{ vars.PUBLISH_SKIP }}              # extra files to leave out
          PUBLISH_CODEC: ${{ vars.PUBLISH_CODEC }}            # default zstd
          PUBLISH_WORK: /mnt/publish
        run: python pipeline.py publish

  # GitHub pauses schedules in public repos after 60 days without activity.
  # One tiny commit per day keeps it running forever.
  keepalive:
    needs: [scrape, xg, wide, info, analytics, publish]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Record last run
        env:
          RESULT: "scrape=${{ needs.scrape.result }} xg=${{ needs.xg.result }} wide=${{ needs.wide.result }} info=${{ needs.info.result }} analytics=${{ needs.analytics.result }} publish=${{ needs.publish.result }}"
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%MZ) $RESULT" > last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git commit -m "last run $(date -u +%F)" && git push || echo "nothing to commit"
